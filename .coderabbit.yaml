# CodeRabbit 审查配置
#
# 这份配置**不做全局静音**。实测统计过一轮（PR #532 / #533，共 15 条意见）：13 条是真
# 缺陷，包括快照被表重建抹掉、日志把笔记正文抄进日志库、类型错误吞掉整条笔记。把
# `profile` 调成 `quiet` 会连这些一起压掉，代价远大于收益。
#
# 唯一真正属于噪声的是**测试文件的组织方式**（fixture 怎么搭、用例该放哪个文件）——
# 那是团队口味，不是缺陷。所以只对 `test/**` 定向说明，其余保持默认。
reviews:
  # 默认值就是 chill，这里写出来是为了防止有人以为噪声来自 assertive。
  profile: chill

  path_instructions:
    - path: "test/**"
      instructions: |
        审查测试代码时，只报**会让测试失效或给出错误结论**的问题：
        - 断言与被测行为不符，或者断言在修复前后都成立（等于没测）；
        - 用例之间通过单例、共享文件或全局状态互相污染，导致结果依赖执行顺序；
        - 资源未释放（数据库、Stream、Timer），或用了可能永不 settle 的等待；
        - Mock/Fake 与真实实现签名不一致，测的不是真实链路。

        不要报以下几类，它们属于团队口味而非缺陷：
        - 用例应该放在哪个测试文件、是否该拆分或搬家；
        - fixture 的搭法偏好（临时目录 vs 固定文件名、是否改用某个 harness），
          只要没有实际的跨用例污染；
        - 命名、注释密度、测试描述的措辞。

        本仓库的测试约定见 `test/AGENTS.md`，它是这些问题的事实来源。
