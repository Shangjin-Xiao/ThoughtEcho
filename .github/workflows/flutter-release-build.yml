name: Flutter发布版Android构建

on:
  # 手动触发工作流
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名称 (例如: 1.0.0)'
        required: true
        default: '1.0.0'
      build_mode:
        description: '构建模式 (debug, profile, release)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - profile
      build_variant:
        description: 'Android ABI 变体 (standard64, arm32Compat, both)'
        required: true
        default: 'standard64'
        type: choice
        options:
          - standard64
          - both
          - arm32Compat
      build_aab:
        description: '额外构建 Google Play 用的 AAB（仅 standard64 + release）'
        required: false
        default: false
        type: boolean

  # 供 release.yml 复用；inputs 上下文对两种触发方式通用，构建逻辑无需区分
  workflow_call:
    inputs:
      version_name:
        description: '版本名称 (例如: 1.0.0)'
        required: true
        type: string
      build_mode:
        description: '构建模式 (debug, profile, release)'
        required: false
        default: 'release'
        type: string
      build_variant:
        description: 'Android ABI 变体 (standard64, arm32Compat, both)'
        required: false
        default: 'standard64'
        type: string
      build_aab:
        description: '额外构建 Google Play 用的 AAB（仅 standard64 + release）'
        required: false
        default: false
        type: boolean
    secrets:
      SENTRY_DSN:
        required: false
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true
      
      - name: 准备构建环境
        run: |
          # 设置Java环境变量用于大内存构建
          echo "GRADLE_OPTS=-Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.prefs/java.util.prefs=ALL-UNNAMED --add-opens=java.base/java.nio.charset=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED" >> $GITHUB_ENV

      - name: 验证正式签名配置
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'release' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [[ "$BUILD_MODE" == "debug" ]]; then
            echo "Debug 构建使用 Android 默认调试签名"
            exit 0
          fi

          missing_secrets=()
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done
          if (( ${#missing_secrets[@]} > 0 )); then
            echo "错误：$BUILD_MODE 构建缺少正式签名配置：${missing_secrets[*]}" >&2
            exit 1
          fi

          umask 077
          keystore_path="android/app/upload-keystore.jks"
          validation_dir="$(mktemp -d)"
          validation_keystore="$validation_dir/validation.p12"
          validation_password="$(head -c 24 /dev/urandom | base64 -w0)"
          trap 'rm -f "$validation_keystore"; rmdir "$validation_dir"' EXIT

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "错误：正式签名密钥库为空" >&2
            exit 1
          fi

          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          keytool -importkeystore -noprompt \
            -srckeystore "$keystore_path" \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$validation_keystore" \
            -deststoretype PKCS12 \
            -deststorepass "$validation_password" \
            -destkeypass "$validation_password" >/dev/null

          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "正式签名配置验证通过"

      - name: 安装Flutter依赖
        run: |
          flutter --version
          flutter pub get
          bash scripts/patch_flutter_quill.sh

      - name: 静态分析
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: 构建 APK
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'release' }}
          BUILD_VARIANT: ${{ inputs.build_variant || 'both' }}
          VERSION_NAME: ${{ inputs.version_name }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # 验证 BUILD_MODE 是否合法
          if [[ "$BUILD_MODE" != "release" && "$BUILD_MODE" != "debug" && "$BUILD_MODE" != "profile" ]]; then
            echo "Error: Invalid build_mode: $BUILD_MODE"
            exit 1
          fi
          if [[ "$BUILD_VARIANT" != "both" && "$BUILD_VARIANT" != "standard64" && "$BUILD_VARIANT" != "arm32Compat" ]]; then
            echo "Error: Invalid build_variant: $BUILD_VARIANT"
            exit 1
          fi
          # 验证 VERSION_NAME 是否符合合法格式
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9.-]+)?$ ]]; then
            echo "Error: Invalid version_name format: $VERSION_NAME"
            exit 1
          fi
          mkdir -p build/app/outputs/release-artifacts

          build_flavor() {
            local FLAVOR="$1"
            local TARGET_PLATFORM="$2"
            local OUTPUT_FLAVOR="${FLAVOR,,}"

            echo "正在构建 $FLAVOR ($BUILD_MODE)..."
            flutter build apk --"$BUILD_MODE" \
              --flavor "$FLAVOR" \
              --target-platform="$TARGET_PLATFORM" \
              --android-project-arg=disable-abi-filtering=true \
              --build-number="${{ github.run_number }}" \
              --build-name="$VERSION_NAME" \
              --dart-define=SENTRY_DSN="$SENTRY_DSN"

            cp "build/app/outputs/flutter-apk/app-$OUTPUT_FLAVOR-$BUILD_MODE.apk" \
              "build/app/outputs/release-artifacts/thoughtecho-$FLAVOR-$BUILD_MODE.apk"
          }

          if [[ "$BUILD_VARIANT" == "both" || "$BUILD_VARIANT" == "standard64" ]]; then
            build_flavor standard64 android-arm64
          fi
          if [[ "$BUILD_VARIANT" == "both" || "$BUILD_VARIANT" == "arm32Compat" ]]; then
            build_flavor arm32Compat android-arm
          fi

      # Google Play 只收 AAB，且要求应用支持 64 位；arm32Compat 是纯 32 位的
      # 兼容变体（关 Impeller、开软件渲染），单独打成 AAB 上传也会被拒，
      # 所以这里只出 standard64 这一个 arm64-v8a 的 AAB。
      - name: 构建 AAB (standard64)
        id: aab
        # 注意不能写 inputs.build_aab == null 做兜底：GitHub 表达式比较会把
        # 两边转成数字，false 和 null 都是 0，关掉开关照样会跑这一步。
        if: >-
          ${{ inputs.build_aab
              && (inputs.build_mode || 'release') == 'release'
              && (inputs.build_variant || 'both') != 'arm32Compat' }}
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail

          # 与 APK 走同一套 flavor/签名/ABI 参数，只换产物格式
          flutter build appbundle --release \
            --flavor standard64 \
            --target-platform=android-arm64 \
            --android-project-arg=disable-abi-filtering=true \
            --build-number="${{ github.run_number }}" \
            --build-name="$VERSION_NAME" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN"

          # 产物在 build/app/outputs/bundle/standard64Release/ 下，
          # 文件名跟着 flavor 走，这里直接按扩展名找，免得改名就断
          aab_path="$(find build/app/outputs/bundle -type f -name '*.aab' | head -n 1)"
          if [[ -z "$aab_path" ]]; then
            echo "::error::未找到 AAB 产物"
            exit 1
          fi

          mkdir -p build/app/outputs/release-artifacts
          cp -v "$aab_path" \
            "build/app/outputs/release-artifacts/thoughtecho-standard64-release.aab"

      # archive: false 时 upload-artifact 只接受单个文件，
      # build_variant=both 会产出两个 APK，因此按变体分开上传。
      - name: 上传 APK (standard64)
        if: ${{ (inputs.build_variant || 'both') != 'arm32Compat' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ inputs.build_mode || 'release' }}-standard64-apk
          path: build/app/outputs/release-artifacts/thoughtecho-standard64-*.apk
          archive: false

      - name: 上传 APK (arm32Compat)
        if: ${{ (inputs.build_variant || 'both') != 'standard64' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ inputs.build_mode || 'release' }}-arm32Compat-apk
          path: build/app/outputs/release-artifacts/thoughtecho-arm32Compat-*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: 上传 AAB (standard64)
        if: ${{ steps.aab.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release-standard64-aab
          path: build/app/outputs/release-artifacts/thoughtecho-standard64-release.aab
          archive: false
          if-no-files-found: error
          retention-days: 30
