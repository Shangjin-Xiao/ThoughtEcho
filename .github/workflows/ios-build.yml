name: Build iOS IPA (No Codesign)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名称 (例如: 1.0.0)'
        required: true
        default: '1.0.0'
      upload_symbols:
        description: '上传调试符号到 Sentry（没配 SENTRY_AUTH_TOKEN 时自动跳过）'
        required: false
        type: boolean
        default: true

  # 供 release.yml 复用
  workflow_call:
    inputs:
      version_name:
        description: '版本名称 (例如: 1.0.0)，三段式数字版本'
        required: true
        type: string
      upload_symbols:
        # 默认开着，release.yml 不用传。发版忘了传符号是不可逆的：
        # dSYM 随 runner 一起销毁，事后补不回来，那个版本的 profile 和原生崩溃栈
        # 就永远只有地址没有函数名。
        description: '上传调试符号到 Sentry'
        required: false
        type: boolean
        default: true
    secrets:
      SENTRY_DSN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false
      SENTRY_URL:
        required: false

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Flutter 诊断
        run: flutter doctor -v
        
      - name: 安装依赖
        run: flutter pub get

      - name: Patch flutter_quill
        run: bash scripts/patch_flutter_quill.sh
        
      - name: 代码分析
        run: flutter analyze --no-fatal-infos
        continue-on-error: true
        
      - name: 清理构建缓存
        run: flutter clean
        
      - name: 构建 iOS 应用包 (无签名)
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # workflow_dispatch 与 workflow_call 统一使用传入的三段式数字版本，
          # 避免从 tag 发布时 IPA 回落到 pubspec.yaml 的版本导致与 Release 不一致。
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Error: Invalid version_name format for iOS: $VERSION_NAME. Must contain only 1-3 dot-separated numbers."
            exit 1
          fi
          flutter build ios --release --no-codesign --no-tree-shake-icons \
            --build-number="${{ github.run_number }}" \
            --build-name="$VERSION_NAME" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN"
        
      - name: 安装 sentry-cli
        # 单独一步，**环境里没有任何凭据**：装 CLI 和用 CLI 分开，装的时候就算
        # 装错了东西也拿不到 token。锁版本同理，不用 `curl | bash` 拉未固定的
        # 安装脚本。
        continue-on-error: true
        env:
          UPLOAD_SYMBOLS: ${{ inputs.upload_symbols }}
        run: |
          set -euo pipefail
          if [ "${UPLOAD_SYMBOLS}" != "true" ]; then
            echo "本次构建选择了不上传符号，跳过安装。"
            exit 0
          fi
          npm install -g @sentry/cli@3.7.0
          sentry-cli --version

      - name: 上传调试符号到 Sentry
        # 这一步只在 CI 上跑，不改二进制、不进 IPA，对应用运行时零影响。
        #
        # 为什么需要：2026-08-28 的 iPad profile 里，Apple 系统库的帧都有名字
        # （_CFRunLoopRunSpecificWithOptions 等），我们自己二进制的帧**全是
        # `unknown`** —— 栈抓到了、符号没传。补上之后至少 Flutter 引擎（C++）和
        # Runner（ObjC）这两层能读出来，而「图片文件读取 / 解码完成回调落在帧与帧
        # 之间」这个待验证的假设，主要就发生在引擎侧。
        #
        # Dart 代码的帧大概率仍然打不开：AOT 机器码不是靠 DWARF 描述的，原生
        # profiler 一般只能把它看成一整块。这是已知上限，不是配置没做对。
        #
        # 刻意**不加** `--split-debug-info`：它会把 Dart 调试信息从二进制里剥走，
        # 应用内日志里的 Dart 异常堆栈就退化成裸地址，而排查记录页性能全靠用户
        # 直接贴可读的 release 日志。`--obfuscate` 同理，绝对不加。
        #
        # 凭据只出现在这一步。CLI 在上一步装好，那一步的环境里没有 token ——
        # 装和用分开，装的时候拿不到凭据。
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # 非美国区的组织要指到自己那个 region（例如 https://de.sentry.io）。
          # 新版组织令牌（sntrys_ 开头）自带 region 信息，可以不配。
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          UPLOAD_SYMBOLS: ${{ inputs.upload_symbols }}
        run: |
          set -euo pipefail

          if [ "${UPLOAD_SYMBOLS}" != "true" ]; then
            echo "本次构建选择了不上传符号，跳过。"
            exit 0
          fi
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || \
             [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "未配置 SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT，跳过符号上传。"
            echo "配置这三个 secret 后，Sentry 上的 profile 和原生崩溃栈才会显示函数名。"
            exit 0
          fi

          if ! command -v sentry-cli >/dev/null 2>&1; then
            echo "sentry-cli 没装上（见上一步），跳过符号上传。"
            exit 0
          fi

          # 路径不写死：Flutter / Xcode 换版本时 dSYM 的产出位置变过。先列出来，
          # 日志里留一份「这次到底传了什么」，下次对不上号时好查。
          echo "本次构建产出的 dSYM："
          find build/ios -maxdepth 4 -name '*.dSYM' -print || true

          sentry-cli debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            build/ios

      - name: 创建未签名的 IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -r ThoughtEcho-unsigned.ipa Payload
          cd ../..
          
      - name: 上传未签名的 IPA 文件
        uses: actions/upload-artifact@v7
        with:
          name: ThoughtEcho-iOS-unsigned-${{ github.run_number }}
          path: build/ipa/ThoughtEcho-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 30
          
      - name: 创建构建信息
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Error: Invalid version_name format: $VERSION_NAME"
            exit 1
          fi
          cat > build/ipa/build-info.txt << EOF
          心迹 ThoughtEcho iOS 构建信息
          ================================
          构建日期: $(date '+%Y-%m-%d %H:%M:%S')
          Flutter 版本: $(flutter --version | head -n 1)
          应用版本: ${VERSION_NAME}+${{ github.run_number }}
          Bundle ID: com.shangjin.thoughtecho
          构建编号: ${{ github.run_number }}
          
          注意事项:
          ========
          这是一个未签名的 IPA 文件。要在真机上安装，您需要：
          
          1. 使用您自己的开发者证书进行签名
          2. 使用第三方工具（如 AltStore, Sideloadly）进行侧载
          3. 通过 Xcode 直接安装到已配置的测试设备
          4. 签名后上传到 TestFlight 进行测试
          
          如何签名和发布:
          ==============
          1. 在 Mac 上安装 Xcode
          2. 在 Xcode 中打开 ios/Runner.xcworkspace
          3. 配置您的 Apple Developer 账号和签名证书
          4. 选择 Product > Archive 创建归档
          5. 通过 Organizer 上传到 App Store Connect
          
          详细文档请参阅: https://flutter.dev/docs/deployment/ios
          EOF
          
      - name: 上传构建信息
        uses: actions/upload-artifact@v7
        with:
          name: build-info-${{ github.run_number }}
          path: build/ipa/build-info.txt
          archive: false
          if-no-files-found: error
          retention-days: 30
